

<div class="login-container">
  <h2>Login</h2>

  <form #loginForm="ngForm" (ngSubmit)="onLogin()" novalidate>
    <input
      type="text"
      [(ngModel)]="username"
      name="username"
      placeholder="Username"
      required
      #usernameField="ngModel"
    />
    <div *ngIf="usernameField.invalid && usernameField.touched" class="error-message">
      Username is required.
    </div>

    <input
      type="password"
      [(ngModel)]="password"
      name="password"
      placeholder="Password"
      required
      #passwordField="ngModel"
    />
    <div *ngIf="passwordField.invalid && passwordField.touched" class="error-message">
      Password is required.
    </div>

    <button type="submit" [disabled]="loginForm.invalid||isLoading">{{ isLoading ? 'Logging in...' : 'Login' }}</button>

    <p *ngIf="isLoading" class="info-text">
      Connecting to backend... Initial connection may take up to 30 seconds.
    </p>

     <a  class="nav-link" [routerLink]="['/register']">
            Register
      </a>
  </form>
</div>
